[project]
name = "bitrix-export"
version = "0.1.0"
description = "Выгрузка истории взаимодействий Bitrix24 для анализа ИИ"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3,<4",
    "google-api-python-client>=2,<3",
    "google-auth>=2,<3",
    "google-auth-httplib2>=0.2,<1",
    "httplib2>=0.22,<1",
    "loguru>=0.7.3,<0.8",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
